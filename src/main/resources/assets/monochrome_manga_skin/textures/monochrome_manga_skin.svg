<path d="M21 36h3v2h-3zM28 36h3v2h-3z" fill="#dfe1e4"/>
<!-- boots/legs detail -->
<path d="M20 41h4v3h-4zM28 41h4v3h-4z" fill="#26292f"/>
<!-- leg back panels -->
<path d="M32 32h8v4h-8zM32 40h8v4h-8z" fill="#202329" stroke="#101216" stroke-width=".4"/>
<path d="M34 33h4v1h-4zM34 41h4v1h-4z" fill="#bfc3c8"/>
